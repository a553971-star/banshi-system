name: Daily Banshi Update

on:
  schedule:
    - cron: "30 10 * * 1-5"  # 台灣時間 18:30（UTC+8），週一到週五
  workflow_dispatch:  # 允許手動觸發

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas requests FinMind tqdm

      - name: Download stock names
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          if [ "$(date +%u)" = "6" ]; then
            python3 download_stock_names.py
          else
            echo "週一到週五跳過 download_stock_names"
          fi

      - name: Build universe
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          if [ "$(date +%u)" = "6" ]; then
            python3 build_universe.py
          else
            echo "週一到週五跳過 build_universe"
          fi

      - name: Fetch EPS data (週六)
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          if [ "$(date +%u)" = "6" ]; then
            python3 fetch_eps.py
          else
            echo "週一到週五跳過 fetch_eps"
          fi

      - name: Update daily data
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          python3 update_daily_data.py

      - name: Run banshi analysis
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          python3 main.py

      - name: Run universe scan
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          python3 analyze_universe.py

      - name: Run AI supply chain scan
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          python3 analyze_ai.py

      - name: Build market cap index
        continue-on-error: true   # 市值是 enhancement，失敗不中斷後續 rotation
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p data
          python3 -c "
          from utils.market_cap import build_market_cap_index
          try:
              r = build_market_cap_index()
              print(f'market_cap.json OK: {len(r[\"stocks\"])} stocks indexed, as_of={r[\"as_of_date\"]}')
              if r['missing_stocks']:
                  print(f'Missing: {len(r[\"missing_stocks\"])} stocks')
                  for m in r['missing_stocks']:
                      print(f'  - {m[\"code\"]}: {m[\"reason\"]}')
          except Exception as e:
              print(f'[ERROR] market_cap build failed: {e}')
          "

      - name: Calculate rotation signals
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p data
          python3 -c "
          from utils.rotation_detector import detect_rotation
          import json
          r = detect_rotation()
          for g in r.get('all_groups') or []:
              for k in ('leaders','second','elastic','members'):
                  g.pop(k, None)
          with open('data/rotation_status.json', 'w', encoding='utf-8') as f:
              json.dump(r, f, ensure_ascii=False, indent=2, default=str)
          print('rotation_status.json updated')
          "

      - name: Commit results
        run: |
          git config user.name "banshi-bot"
          git config user.email "banshi-bot@github.com"
          git add latest_decisions.csv universe.csv state_log.csv shareholding_latest.csv latest_decisions_universe.csv
          git add eps_latest.csv 2>/dev/null || true
          git add latest_decisions_ai.csv 2>/dev/null || true
          git add stock_names.csv 2>/dev/null || true
          git add banshi.db 2>/dev/null || true
          git add data/rotation_status.json 2>/dev/null || true
          git add data/market_cap.json 2>/dev/null || true
          git commit -m "daily update $(date '+%Y-%m-%d')" || echo "no changes"
          git pull --rebase || true
          git push
